<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Program Desk</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E6E9E3; --panel:#F4F6F1; --panel2:#FAFBF8;
  --ink:#1B211E; --ink2:#4A544F; --ink3:#7C857F;
  --rule:#C6CCC2; --ruleS:#A9B1A5;
  --blue:#23485F; --blueW:#DDE6EB; --onblue:#F7F9F5;
  --green:#35734A; --amber:#8E6410; --red:#9E3630;
  --violet:#57468C; --violetW:#E9E5F4;
  --shadow:0 1px 0 rgba(27,33,30,.06);
  --sans:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#141916; --panel:#1C221E; --panel2:#232A25;
    --ink:#E4E8E2; --ink2:#A6AFA7; --ink3:#78827A;
    --rule:#2E3630; --ruleS:#414A43;
    --blue:#8FB9D4; --blueW:#1B2A33; --onblue:#101613;
    --green:#6FB884; --amber:#D8A63E; --red:#E0736B;
    --violet:#A796E0; --violetW:#241F35;
    --shadow:0 1px 0 rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --paper:#141916; --panel:#1C221E; --panel2:#232A25;
  --ink:#E4E8E2; --ink2:#A6AFA7; --ink3:#78827A;
  --rule:#2E3630; --ruleS:#414A43;
  --blue:#8FB9D4; --blueW:#1B2A33; --onblue:#101613;
  --green:#6FB884; --amber:#D8A63E; --red:#E0736B;
  --violet:#A796E0; --violetW:#241F35;
  --shadow:0 1px 0 rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  height:100%;margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:13.5px;line-height:1.5;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit;font-variant-numeric:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.app{height:100%;display:flex;flex-direction:column;min-height:0}
.topbar{
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  padding:11px 18px 10px;border-bottom:1px solid var(--rule);background:var(--panel);
}
.brandmark{display:flex;align-items:baseline;gap:9px}
.brandmark b{font-size:15px;font-weight:700;letter-spacing:-.015em}
.brandmark span{font-size:11.5px;color:var(--ink3)}
.progline{display:flex;align-items:baseline;gap:10px;margin-left:auto;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.ragdot{width:8px;height:8px;border-radius:50%;display:inline-block;vertical-align:baseline}
.rag-green{background:var(--green)} .rag-amber{background:var(--amber)} .rag-red{background:var(--red)}

/* intake spine */
.spine{display:flex;align-items:center;gap:10px;padding:8px 18px;border-bottom:1px solid var(--rule);background:var(--panel2)}
.spine input{
  flex:1;min-width:0;background:transparent;border:0;border-bottom:1px dashed var(--ruleS);
  padding:5px 2px;font-size:13px;color:var(--ink)
}
.spine input::placeholder{color:var(--ink3)}
.spine input:focus{outline:none;border-bottom-color:var(--blue)}

.body{flex:1;display:grid;grid-template-columns:186px minmax(0,1fr) 336px;min-height:0}

/* rail */
.rail{border-right:1px solid var(--rule);background:var(--panel);overflow-y:auto;padding:10px 0 24px}
.railgroup{padding:12px 16px 4px;font-size:11px;color:var(--ink3);letter-spacing:.01em}
.grouphead{margin:18px 0 7px;font-size:12px;font-weight:600;color:var(--ink2);border-bottom:1px solid var(--ruleS);padding-bottom:4px}
.navitem{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  background:none;border:0;padding:6px 16px;cursor:pointer;color:var(--ink2);font-size:13px;
  border-left:2px solid transparent;
}
.navitem:hover{color:var(--ink);background:var(--panel2)}
.navitem[aria-current="true"]{color:var(--ink);font-weight:600;border-left-color:var(--blue);background:var(--panel2)}
.navitem .ct{margin-left:auto;font-size:11.5px;color:var(--ink3);font-weight:400}
.navitem .ct.warn{color:var(--red);font-weight:600}

/* main */
.main{overflow-y:auto;min-width:0;padding:20px 22px 60px}
.viewhead{margin:0 0 4px;font-size:19px;font-weight:600;letter-spacing:-.015em}
.viewsub{margin:0 0 18px;color:var(--ink2);max-width:66ch}

/* drawer */
.drawer{border-left:1px solid var(--rule);background:var(--panel);overflow-y:auto;min-width:0;padding-bottom:40px}
.drawerhead{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--rule);padding:12px 16px;z-index:2}
.drawerhead h2{margin:0;font-size:13px;font-weight:600}
.drawerhead p{margin:3px 0 0;font-size:11.5px;color:var(--ink3)}

/* ---------- ledger ---------- */
.ledgerwrap{overflow-x:auto;border-top:1px solid var(--ruleS);margin-bottom:8px}
.ledger{min-width:100%;width:max-content}
.lrow{display:grid;align-items:baseline;gap:12px;padding:8px 4px;border-bottom:1px solid var(--rule)}
.lhead{border-bottom:1px solid var(--ruleS);padding-bottom:5px;font-size:11.5px;color:var(--ink3)}
.lbody .lrow{cursor:pointer}
.lbody .lrow:hover{background:var(--panel2)}
.lcell{min-width:0;overflow-wrap:anywhere}
.lcell.num{text-align:right}
.ref{color:var(--ink3);font-size:12px;font-weight:500}
.ttl{font-weight:500}
.sub{display:block;font-size:11.5px;color:var(--ink3);font-weight:400;margin-top:1px}
.chip{display:inline-block;padding:1px 7px;border:1px solid currentColor;border-radius:9px;font-size:11px;font-weight:500;white-space:nowrap}
.t-green{color:var(--green)} .t-amber{color:var(--amber)} .t-red{color:var(--red)}
.t-blue{color:var(--blue)} .t-mute{color:var(--ink3)} .t-violet{color:var(--violet)}
.empty{padding:26px 4px;color:var(--ink3);border-bottom:1px solid var(--rule)}
.empty b{display:block;color:var(--ink2);font-weight:600;margin-bottom:3px}

/* ---------- controls ---------- */
.btn{
  background:var(--panel2);border:1px solid var(--ruleS);color:var(--ink);
  padding:5px 11px;border-radius:3px;cursor:pointer;font-size:12.5px;font-weight:500;
}
.btn:hover{border-color:var(--ink3)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--onblue)}
.btn.pri:hover{opacity:.9}
.btn.sm{padding:3px 8px;font-size:11.5px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2);padding:3px 6px}
.btn.ghost:hover{color:var(--ink);border-color:var(--rule)}
.btn.danger{color:var(--red);border-color:var(--rule)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:11.5px;color:var(--ink3);margin-bottom:3px}
.inp,textarea.inp,select.inp{
  width:100%;background:var(--panel2);border:1px solid var(--ruleS);border-radius:3px;
  padding:6px 8px;font-size:13px;color:var(--ink)
}
textarea.inp{resize:vertical;min-height:90px;line-height:1.55}
.inp:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px var(--blueW)}
.seg{display:flex;border:1px solid var(--ruleS);border-radius:3px;overflow:hidden}
.seg button{background:var(--panel2);border:0;border-right:1px solid var(--rule);padding:4px 10px;cursor:pointer;font-size:12px;color:var(--ink2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--onblue);font-weight:600}

/* ---------- panels & stats ---------- */
.panel{border:1px solid var(--rule);background:var(--panel);border-radius:4px;padding:14px 16px;margin-bottom:16px}
.panel>h3{margin:0 0 10px;font-size:13px;font-weight:600}
.statline{display:flex;flex-wrap:wrap;gap:0;border-top:1px solid var(--ruleS);margin:0 0 20px}
.stat{flex:1 1 128px;padding:9px 14px 10px 0;border-bottom:1px solid var(--rule)}
.stat b{display:block;font-size:23px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.stat span{font-size:11.5px;color:var(--ink3)}
.meter{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.hairnote{font-size:11.5px;color:var(--ink3);margin:6px 0 0}

/* program masthead */
.masthead{border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:4px}
.masthead h1{margin:0;font-size:27px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.masthead p{margin:5px 0 0;color:var(--ink2);max-width:62ch}
.weekbar{height:3px;background:var(--rule);margin:12px 0 0;position:relative}
.weekbar i{position:absolute;inset:0 auto 0 0;background:var(--blue)}
.weekbar b{position:absolute;top:-1px;bottom:-1px;width:2px;background:var(--red)}

/* ---------- proposals ---------- */
.prop{border-bottom:1px solid var(--rule);padding:11px 16px;border-left:2px solid var(--violet)}
.prop .kind{font-size:11px;color:var(--violet);font-weight:600;margin-bottom:2px}
.prop .ptitle{font-weight:500;margin-bottom:3px}
.prop .quote{font-family:var(--serif);font-size:12.5px;color:var(--ink2);border-left:2px solid var(--rule);padding-left:8px;margin:6px 0 8px}
.prop .meta{font-size:11.5px;color:var(--ink3);margin-bottom:8px}
.conf{display:inline-flex;gap:2px;vertical-align:middle;margin-left:6px}
.conf i{width:11px;height:3px;background:var(--rule)}
.conf i.on{background:var(--violet)}

/* ---------- document surface ---------- */
.doc{font-family:var(--serif);font-size:15.5px;line-height:1.62;max-width:72ch;color:var(--ink)}
.doc h1{font-family:var(--sans);font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0 0 12px;line-height:1.2}
.doc h2{font-family:var(--sans);font-size:15px;font-weight:600;margin:26px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--rule)}
.doc h3{font-family:var(--sans);font-size:13px;font-weight:600;margin:18px 0 5px}
.doc p{margin:0 0 11px}
.doc ul,.doc ol{margin:0 0 12px;padding-left:22px}
.doc li{margin-bottom:4px}
.doc table{border-collapse:collapse;width:100%;font-family:var(--sans);font-size:12.5px;margin:0 0 14px}
.doc th,.doc td{border-bottom:1px solid var(--rule);padding:6px 9px 6px 0;text-align:left;vertical-align:top}
.doc th{color:var(--ink3);font-weight:500;border-bottom-color:var(--ruleS)}
.doc hr{border:0;border-top:1px solid var(--rule);margin:22px 0}
.doc code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88em;background:var(--panel);padding:1px 4px;border-radius:2px}

.tmplgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(174px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:3px;overflow:hidden;margin-bottom:18px}
.tmpl{background:var(--panel);border:0;text-align:left;padding:10px 12px;cursor:pointer;color:var(--ink)}
.tmpl:hover{background:var(--panel2)}
.tmpl[aria-pressed="true"]{background:var(--blueW)}
.tmpl b{display:block;font-size:12.5px;font-weight:600;margin-bottom:2px}
.tmpl span{font-size:11.5px;color:var(--ink3);line-height:1.35;display:block}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;z-index:40;overflow-y:auto}
.modal{background:var(--paper);border:1px solid var(--ruleS);border-radius:5px;width:min(560px,100%);padding:18px 20px 20px;box-shadow:0 12px 40px rgba(0,0,0,.28)}
.modal h3{margin:0 0 14px;font-size:15px;font-weight:600}
.modal .row.end{justify-content:flex-end;margin-top:16px}

/* ---------- misc ---------- */
.thinking{color:var(--ink3);font-size:12.5px;display:flex;align-items:center;gap:7px}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--violet);animation:p 1.1s ease-in-out infinite}
@keyframes p{0%,100%{opacity:.25}50%{opacity:1}}
.banner{border:1px solid var(--ruleS);border-left:2px solid var(--amber);background:var(--panel);padding:9px 12px;border-radius:3px;font-size:12.5px;color:var(--ink2);margin-bottom:14px}
.mobileonly{display:none}
.timeline{display:grid;gap:5px;margin-top:4px}
.tlrow{display:grid;grid-template-columns:minmax(120px,1fr) minmax(0,3fr);gap:12px;align-items:center;font-size:12.5px}
.tltrack{position:relative;height:16px;background:var(--panel);border:1px solid var(--rule);border-radius:2px}
.tlbar{position:absolute;top:2px;bottom:2px;border-radius:1px;opacity:.85}
.tlnow{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--red)}

@media (max-width:1080px){ .body{grid-template-columns:168px minmax(0,1fr)} .drawer{display:none} .mobileonly{display:inline-flex} }
@media (max-width:720px){
  .body{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .rail{border-right:0;border-bottom:1px solid var(--rule);display:flex;overflow-x:auto;padding:0;gap:0}
  .railgroup{display:none}
  .navitem{border-left:0;border-bottom:2px solid transparent;white-space:nowrap;padding:9px 12px}
  .navitem[aria-current="true"]{border-bottom-color:var(--blue)}
  .navitem .ct{margin-left:5px}
  .main{padding:16px 14px 70px}
  .topbar{padding:10px 14px}
  .spine{padding:7px 14px}
  .masthead h1{font-size:22px}
}
</style>
</head>
<body>
<div style="background:var(--paper); padding:10px 14px; border-bottom:1px solid var(--rule);">
  <a href="program-desk-case-study.html" style="font-family:'Archivo',system-ui,sans-serif; font-size:12.5px; color:var(--ink3); text-decoration:none; display:inline-flex; align-items:center; gap:6px;">
    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
    Back to case study
  </a>
</div>
<div class="app">
  <header class="topbar">
    <div class="brandmark"><b>Program Desk</b><span>technical program management</span></div>
    <div class="progline" id="progline"></div>
  </header>

  <div class="spine">
    <input id="spineInput" placeholder="Paste a thread, transcript or chat log here - or type a question about the program" aria-label="Intake">
    <button class="btn pri" id="spineGo">Read it</button>
    <button class="btn mobileonly" id="mobProps">Queue</button>
  </div>

  <div class="body">
    <nav class="rail" id="rail" aria-label="Sections"></nav>
    <main class="main" id="main"></main>
    <aside class="drawer" id="drawer">
      <div class="drawerhead">
        <h2>Review queue</h2>
        <p>Nothing enters a log until you accept it.</p>
      </div>
      <div id="propList"></div>
    </aside>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   Program Desk - a TPM operating console.
   Signals in → structured proposals → human-accepted logs → documents out.
   ============================================================ */

/* ---------- capabilities (design for absence) ---------- */
let DB=null, SAMPLE=null, USER=null, DOWNLOADS=null, ME=null;
let DEMO=false;                       // true when hosted outside claude.ai: canned data, canned AI
const canAI=()=>!!SAMPLE||DEMO;

/* ---------- state ---------- */
const S={
  view:'brief',
  program:null,
  actions:[], risks:[], decisions:[], deps:[], milestones:[], budget:[],
  proposals:[], docs:[], signals:[],
  busy:false, docDraft:null, docType:'status', askAnswer:'', filter:'open'
};

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,txt)=>{const n=document.createElement(t); if(c)n.className=c; if(txt!=null)n.textContent=txt; return n;};
const uid=p=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().slice(0,10);
const dnum=s=>{const t=Date.parse(s); return isNaN(t)?null:t;};
const days=(a,b)=>{const x=dnum(a),y=dnum(b); return (x==null||y==null)?null:Math.round((x-y)/864e5);};
const money=n=>{const v=Number(n)||0; return (v<0?'−':'')+'$'+Math.abs(v).toLocaleString('en-US',{maximumFractionDigits:0});};
const fdate=s=>{const t=dnum(s); if(t==null)return '-';
  return new Date(t).toLocaleDateString('en-US',{month:'short',day:'numeric'});};
const overdue=r=>r.status!=='Done'&&dnum(r.due)!=null&&dnum(r.due)<dnum(today());

/* ============================================================
   Log definitions - one spec drives table, form and rollups
   ============================================================ */
const LOGS={
  actions:{
    label:'Action items', coll:'actions', prefix:'A', title:'Action items',
    blurb:'Every commitment made in a meeting, thread or chat - with the sentence that created it.',
    sortKey:r=>dnum(r.due)??9e15,
    cols:[
      {k:'ref',   label:'ID',       w:'52px'},
      {k:'title', label:'Action',   w:'minmax(220px,2.4fr)', main:true, subKey:'notes'},
      {k:'owner', label:'Owner',    w:'110px'},
      {k:'due',   label:'Due',      w:'80px', type:'date'},
      {k:'priority',label:'Priority',w:'74px', type:'enum', opts:['P0','P1','P2','P3']},
      {k:'status',label:'Status',   w:'106px', type:'status', opts:['Not started','In progress','Blocked','Done']}
    ],
    extra:[{k:'notes',label:'Notes',type:'text'},{k:'workstream',label:'Workstream'}],
    tone:v=>({'Done':'green','In progress':'blue','Blocked':'red','Not started':'mute'}[v]||'mute'),
    isOpen:r=>r.status!=='Done'
  },
  risks:{
    label:'Risk log', coll:'risks', prefix:'R', title:'Risk log',
    blurb:'Scored by exposure. A risk without a named owner and a trigger date is a wish.',
    sortKey:r=>-expo(r),
    cols:[
      {k:'ref',label:'ID',w:'52px'},
      {k:'title',label:'Risk',w:'minmax(220px,2.4fr)',main:true,subKey:'mitigation'},
      {k:'probability',label:'Prob',w:'64px',type:'enum',opts:['Low','Medium','High']},
      {k:'impact',label:'Impact',w:'70px',type:'enum',opts:['Low','Medium','High']},
      {k:'_expo',label:'Exposure',w:'80px',type:'expo'},
      {k:'owner',label:'Owner',w:'110px'},
      {k:'status',label:'Status',w:'104px',type:'status',opts:['Open','Mitigating','Accepted','Closed','Realized']}
    ],
    extra:[{k:'mitigation',label:'Mitigation',type:'text'},{k:'trigger',label:'Trigger / review date',type:'date'},{k:'contingency',label:'Contingency',type:'text'}],
    tone:v=>({'Closed':'green','Mitigating':'blue','Accepted':'mute','Realized':'red','Open':'amber'}[v]||'amber'),
    isOpen:r=>r.status!=='Closed'
  },
  decisions:{
    label:'Decision log', coll:'decisions', prefix:'D', title:'Decision log',
    blurb:'What was decided, by whom, on what basis - so it is not relitigated in week 19.',
    sortKey:r=>-(dnum(r.date)??0),
    cols:[
      {k:'ref',label:'ID',w:'52px'},
      {k:'title',label:'Decision',w:'minmax(220px,2.6fr)',main:true,subKey:'rationale'},
      {k:'decidedBy',label:'Decided by',w:'120px'},
      {k:'date',label:'Date',w:'80px',type:'date'},
      {k:'status',label:'Standing',w:'110px',type:'status',opts:['Proposed','Agreed','Reversible','Locked','Superseded']}
    ],
    extra:[{k:'rationale',label:'Rationale',type:'text'},{k:'alternatives',label:'Alternatives considered',type:'text'}],
    tone:v=>({'Agreed':'green','Locked':'blue','Proposed':'amber','Superseded':'mute','Reversible':'mute'}[v]||'mute'),
    isOpen:r=>r.status==='Proposed'
  },
  deps:{
    label:'Dependencies', coll:'deps', prefix:'X', title:'Cross-team dependencies',
    blurb:'What you need, from whom, by when - and how confident you are that it lands.',
    sortKey:r=>dnum(r.neededBy)??9e15,
    cols:[
      {k:'ref',label:'ID',w:'52px'},
      {k:'title',label:'What we need',w:'minmax(200px,2.2fr)',main:true,subKey:'notes'},
      {k:'provider',label:'From',w:'130px'},
      {k:'neededBy',label:'Needed by',w:'88px',type:'date'},
      {k:'confidence',label:'Confidence',w:'92px',type:'enum',opts:['Low','Medium','High']},
      {k:'status',label:'Status',w:'104px',type:'status',opts:['Requested','Committed','At risk','Delivered','Blocked']}
    ],
    extra:[{k:'notes',label:'Notes',type:'text'},{k:'blocks',label:'Blocks which milestone'}],
    tone:v=>({'Delivered':'green','Committed':'blue','At risk':'amber','Blocked':'red','Requested':'mute'}[v]||'mute'),
    isOpen:r=>r.status!=='Delivered'
  },
  milestones:{

async function put(coll,rec){
  const id=rec.id||uid(coll);
  const {id:_,...data}=rec;
  if(DB){ try{ await DB.doc(coll+'/'+id).set(data); return id; }catch(e){} }
  S[coll]=[...S[coll].filter(r=>r.id!==id),{id,...data}];
  render(); return id;
}
async function patch(coll,id,data){
  if(DB){ try{ await DB.doc(coll+'/'+id).update(data); return; }catch(e){} }
  S[coll]=S[coll].map(r=>r.id===id?{...r,...data}:r); render();
}
async function drop(coll,id){
  if(DB){ try{ await DB.doc(coll+'/'+id).delete(); return; }catch(e){} }
  S[coll]=S[coll].filter(r=>r.id!==id); render();
}
async function saveProgram(p){
  S.program={...S.program,...p};
  if(DB){ try{ await DB.doc('program/current').set(S.program); return; }catch(e){} }
  render();
}
function nextRef(coll){
  const pre=LOGS[coll].prefix;
  const n=S[coll].reduce((m,r)=>{const v=parseInt(String(r.ref||'').replace(/\D/g,''),10); return isNaN(v)?m:Math.max(m,v);},0);
  return pre+'-'+String(n+1).padStart(2,'0');
}

   Program context for the model
   ============================================================ */
function contextBlock(depth){
  const p=S.program||{};
  const lines=[
    'PROGRAM: '+(p.name||'Untitled'),
    'GOAL: '+(p.goal||'not stated'),
    'PHASE: '+(p.phase||'-')+'  |  WEEK '+(p.week||1)+' of '+(p.weeks||12)+'  |  OVERALL RAG: '+(p.rag||'Green'),
    p.stakeholders?('STAKEHOLDERS: '+p.stakeholders):'',
    p.constraints?('CONSTRAINTS: '+p.constraints):'',
    p.tenets?('OPERATING PRINCIPLES: '+p.tenets):''
  ].filter(Boolean);
  if(depth==='light') return lines.join('\n');

  const tbl=(name,rows,fn)=>rows.length?('\n'+name+':\n'+rows.slice(0,24).map(fn).join('\n')):'';
  return lines.join('\n')
    +tbl('OPEN ACTIONS',S.actions.filter(r=>r.status!=='Done'),r=>`- [${r.ref}] ${r.title} - ${r.owner||'unassigned'}, due ${r.due||'no date'}, ${r.status}${overdue(r)?' (OVERDUE)':''}`)
    +tbl('RISKS',S.risks.filter(r=>r.status!=='Closed'),r=>`- [${r.ref}] ${r.title} - P:${r.probability} I:${r.impact} exposure ${expo(r)}, owner ${r.owner||'unassigned'}, ${r.status}. Mitigation: ${r.mitigation||'none recorded'}`)
    +tbl('MILESTONES',S.milestones,r=>`- [${r.ref}] ${r.title} - baseline ${r.baseline||'?'}, current ${r.current||'?'}, slip ${days(r.current,r.baseline)??'?'}d, ${r.status}`)
    +tbl('DEPENDENCIES',S.deps.filter(r=>r.status!=='Delivered'),r=>`- [${r.ref}] ${r.title} from ${r.provider||'?'} by ${r.neededBy||'?'} - ${r.status}, confidence ${r.confidence||'?'}`)
    +tbl('DECISIONS',S.decisions,r=>`- [${r.ref}] ${r.title} - ${r.decidedBy||'?'} on ${r.date||'?'}, ${r.status}`)
    +tbl('BUDGET',S.budget,r=>`- [${r.ref}] ${r.title}: planned ${money(r.planned)}, committed ${money(r.committed)}, actual ${money(r.actual)}, variance ${money((Number(r.actual)||0)-(Number(r.planned)||0))}`);
}

async function runExtract(text,source){
  if(DEMO) return demoExtract(text,source);

  S.busy='extract'; render();
  const prompt=
`You are the extraction engine behind a technical program manager's tracker. You read raw workplace signal and turn it into trackable records. You are precise and you never invent a commitment that was not made.

Program context so you can resolve names, dates and references:
${contextBlock('light')}
Today's date is ${today()}.

SIGNAL SOURCE: ${source}
--- BEGIN SIGNAL ---
${text.slice(0,24000)}
--- END SIGNAL ---

Extract every trackable item. Rules:
- An "action" needs someone doing something. If no owner was named, leave owner empty rather than guessing.
- A "risk" is a future condition that would hurt if it occurred. Something already broken is an action or an issue, not a risk.
- A "decision" is a choice that was actually settled, not one being debated.
- A "dependency" is work owed by a team outside this program.
- Resolve relative dates ("end of next week", "before the offsite") into YYYY-MM-DD using today's date. If you cannot, leave empty.
- "question" is for genuinely unresolved open questions worth tracking.
- confidence reflects how clearly the signal supports the item. Below 0.5 means you are inferring.
- Omit fields that do not apply to the kind. Do not pad.
- If the signal contains nothing trackable, return an empty items array.

Respond with ONLY a JSON object in exactly this shape, no prose and no markdown fences:
${EXTRACT_SCHEMA}`;

  try{
    const data=await SAMPLE.json(prompt,{modelTier:'default',cache:false});
    const items=Array.isArray(data.items)?data.items:[];
    const sigId=await put('signals',{source,summary:data.summary||'',sentiment:data.sentiment||'',
      excerpt:text.slice(0,400),at:new Date().toISOString(),count:items.length});
    for(const it of items){
      await put('proposals',{...it,signal:sigId,source,at:new Date().toISOString()});
    }
    S.busy=false;
    if(!items.length) flash('Read it - nothing trackable in there.');
    else flash(items.length+' item'+(items.length===1?'':'s')+' waiting in the review queue.');
    render();
  }catch(e){
    S.busy=false;
    flash(sampleError(e));
    render();
  }
}

function sampleError(e){
  const c=e&&e.code;
  if(c==='not_granted') return 'This view is not allowed to ask Claude, so extraction is off. Manual entry still works.';
  if(c==='rate_limited') return 'Too many requests at once. Give it a minute.';
  if(c==='cancelled') return 'Stopped.';
  return 'That did not go through: '+((e&&e.message)||'unknown error');
}

/* proposal → log record */
const KIND_MAP={action:'actions',risk:'risks',decision:'decisions',dependency:'deps',milestone:'milestones',budget:'budget',question:'actions'};
const confLevel=v=>typeof v==='string'&&v?v:(Number(v)>=.75?'High':Number(v)>=.4?'Medium':'Low');
function toRecord(p){
  const coll=KIND_MAP[p.kind]; if(!coll) return null;
  const base={ref:nextRef(coll),title:p.title||'Untitled',source:p.source||'',quote:p.quote||'',
    createdAt:new Date().toISOString(),acceptedBy:(ME&&ME.id)||''};
  if(coll==='actions') return [coll,{...base,title:p.kind==='question'?('Resolve: '+(p.title||'open question')):base.title,
    owner:p.owner||'',due:p.due||'',priority:p.kind==='question'?'P2':(p.priority||'P2'),status:'Not started',notes:p.notes||''}];
  if(coll==='risks')   return [coll,{...base,probability:p.probability||'Medium',impact:p.impact||'Medium',owner:p.owner||'',status:'Open',mitigation:p.mitigation||'',trigger:p.due||''}];
  if(coll==='decisions')return [coll,{...base,decidedBy:p.decidedBy||p.owner||'',date:p.date||today(),status:'Agreed',rationale:p.rationale||''}];
  if(coll==='deps')    return [coll,{...base,provider:p.provider||'',neededBy:p.neededBy||p.due||'',confidence:confLevel(p.confidence),status:'Requested',notes:p.notes||''}];
  if(coll==='milestones')return [coll,{...base,baseline:p.baseline||p.date||'',current:p.current||p.date||'',status:'On track',owner:p.owner||''}];
  if(coll==='budget')  return [coll,{...base,planned:Number(p.amount)||0,committed:0,actual:0,category:p.category||''}];
  return null;
}
async function acceptProposal(p){
  const made=toRecord(p);
  if(!made){ await drop('proposals',p.id); return; }
  await put(made[0],made[1]);
  await drop('proposals',p.id);
}

/* ============================================================
   Tiny markdown renderer
   ============================================================ */
function md(src){
  const s=String(src||'');
  const esc=x=>x.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const inline=x=>esc(x)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  const lines=s.split('\n'); const out=[]; let i=0;
  const isRow=l=>/^\s*\|.*\|\s*$/.test(l);
  while(i<lines.length){
    const l=lines[i];
    if(/^\s*$/.test(l)){ i++; continue; }
    if(/^\s*(---|\*\*\*|___)\s*$/.test(l)){ out.push('<hr>'); i++; continue; }
    const h=l.match(/^(#{1,4})\s+(.*)$/);
    if(h){ const lv=Math.min(h[1].length,3); out.push(`<h${lv}>${inline(h[2])}</h${lv}>`); i++; continue; }
    if(isRow(l)&&isRow(lines[i+1]||'')&&/^[\s|:-]+$/.test(lines[i+1])){
      const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const head=cells(l); i+=2; const rows=[];
      while(i<lines.length&&isRow(lines[i])){ rows.push(cells(lines[i])); i++; }
      out.push('<table><thead><tr>'+head.map(c=>`<th>${inline(c)}</th>`).join('')+'</tr></thead><tbody>'
        +rows.map(r=>'<tr>'+r.map(c=>`<td>${inline(c)}</td>`).join('')+'</tr>').join('')+'</tbody></table>');
      continue;
    }
    if(/^\s*([-*+])\s+/.test(l)){
      const items=[]; while(i<lines.length&&/^\s*([-*+])\s+/.test(lines[i])){ items.push(lines[i].replace(/^\s*[-*+]\s+/,'')); i++; }
      out.push('<ul>'+items.map(x=>`<li>${inline(x)}</li>`).join('')+'</ul>'); continue;
    }
    if(/^\s*\d+[.)]\s+/.test(l)){
      const items=[]; while(i<lines.length&&/^\s*\d+[.)]\s+/.test(lines[i])){ items.push(lines[i].replace(/^\s*\d+[.)]\s+/,'')); i++; }
      out.push('<ol>'+items.map(x=>`<li>${inline(x)}</li>`).join('')+'</ol>'); continue;
    }
    const para=[]; while(i<lines.length&&!/^\s*$/.test(lines[i])&&!/^\s*(#{1,4}\s|[-*+]\s|\d+[.)]\s|\|)/.test(lines[i])){ para.push(lines[i]); i++; }
    out.push(`<p>${inline(para.join(' '))}</p>`);
  }
  return out.join('');
}

function cell(r,c,L,key){
  const d=el('div','lcell');
  const v=r[c.k];
  if(c.k==='ref'){ d.className+=''; d.appendChild(el('span','ref',v||'-')); return d; }
  if(c.main){
    const t=el('div','ttl',r.title||'Untitled');
    const sub=[r[c.subKey],r.quote?'“'+r.quote+'”':''].filter(Boolean).join(' - ');
    if(sub) t.appendChild(el('span','sub',sub));
    d.appendChild(t); return d;
  }
  if(c.type==='status'){
    const b=el('button','chip t-'+L.tone(v)); b.type='button'; b.textContent=v||'-';
    b.style.cursor='pointer'; b.title='Click to advance';
    b.onclick=e=>{ e.stopPropagation();
      const i=c.opts.indexOf(v); patch(key,r.id,{status:c.opts[(i+1)%c.opts.length]}); };
    d.appendChild(b); return d;
  }
  if(c.type==='date'){ d.textContent=fdate(v); if(c.k==='due'&&overdue(r)) d.className+=' t-red'; return d; }
  if(c.type==='money'){ d.className+=' num'; d.textContent=money(v); return d; }
  if(c.type==='expo'){ const n=expo(r); d.className+=' num'; d.appendChild(el('span','chip t-'+expoTone(n),String(n))); return d; }
  if(c.type==='slip'){ const n=days(r.current,r.baseline); d.className+=' num';
    d.textContent=n==null?'-':(n>0?'+'+n+'d':n+'d'); if(n>0)d.className+=' t-red'; else if(n<0)d.className+=' t-green'; return d; }
  if(c.type==='variance'){ const n=(Number(r.actual)||0)-(Number(r.planned)||0); d.className+=' num t-'+(n>0?'red':n<0?'green':'mute');
    d.textContent=(n>0?'+':'')+money(n); return d; }
  if(c.type==='enum'&&(c.k==='probability'||c.k==='impact'||c.k==='confidence')){
    d.appendChild(el('span','chip t-'+(v==='High'?(c.k==='confidence'?'green':'red'):v==='Low'?(c.k==='confidence'?'red':'mute'):'amber'),v||'-')); return d; }
  if(c.k==='owner'||c.k==='decidedBy'||c.k==='provider'){ d.textContent=v||'-'; if(!v) d.className+=' t-amber'; return d; }
  d.textContent=v==null||v===''?'-':String(v); return d;
}

function budgetRoll(m){
  const plan=S.budget.reduce((a,r)=>a+(Number(r.planned)||0),0);
  const com=S.budget.reduce((a,r)=>a+(Number(r.committed)||0),0);
  const act=S.budget.reduce((a,r)=>a+(Number(r.actual)||0),0);
  const p=el('div','panel'); p.appendChild(el('h3',null,'Rollup'));
  const mt=el('div','meter');
  const a=el('i'); a.style.width=Math.min(100,plan?act/plan*100:0)+'%'; a.style.background='var(--blue)';
  const b=el('i'); b.style.width=Math.min(100-(plan?act/plan*100:0),plan?com/plan*100:0)+'%'; b.style.background='var(--ink3)';
  mt.append(a,b); p.appendChild(mt);
  p.appendChild(el('p','hairnote','Actual '+money(act)+' · committed '+money(com)+' · planned '+money(plan)
    +' · remaining '+money(plan-act-com)+(plan&&act>plan?' - over plan':'')));
  m.appendChild(p);
}
function timeline(m){
  const rows=S.milestones.filter(r=>dnum(r.current)!=null);
  if(!rows.length) return;
  const all=rows.flatMap(r=>[dnum(r.baseline),dnum(r.current)]).filter(x=>x!=null).concat([Date.now()]);
  const min=Math.min(...all), max=Math.max(...all), span=Math.max(1,max-min);
  const p=el('div','panel'); p.appendChild(el('h3',null,'Baseline against current'));
  const tl=el('div','timeline');
  rows.sort((x,y)=>(dnum(x.current)||0)-(dnum(y.current)||0)).forEach(r=>{
    const row=el('div','tlrow');
    row.appendChild(el('div',null,r.ref+' '+r.title));
    const tr=el('div','tltrack');
    const bl=dnum(r.baseline), cu=dnum(r.current);
    if(bl!=null&&cu!=null&&cu!==bl){
      const bar=el('div','tlbar');
      bar.style.left=((Math.min(bl,cu)-min)/span*100)+'%';
      bar.style.width=Math.max(1.2,(Math.abs(cu-bl)/span*100))+'%';
      bar.style.background=cu>bl?'var(--red)':'var(--green)';
      tr.appendChild(bar);
    }
    if(cu!=null){ const dot=el('div','tlbar'); dot.style.left=((cu-min)/span*100)+'%'; dot.style.width='3px';
      dot.style.background='var(--blue)'; tr.appendChild(dot); }
    const now=el('div','tlnow'); now.style.left=((Date.now()-min)/span*100)+'%'; tr.appendChild(now);
    row.appendChild(tr); tl.appendChild(row);
  });
  p.appendChild(tl);
  p.appendChild(el('p','hairnote','Blue marks the current date for each milestone; the bar is the distance it has moved from baseline. The red hairline is today.'));
  m.appendChild(p);
}
function riskGrid(m){
  const live=S.risks.filter(r=>r.status!=='Closed'); if(!live.length) return;
  const lv=['Low','Medium','High'];
  const p=el('div','panel'); p.appendChild(el('h3',null,'Exposure grid'));
  const g=el('div'); g.style.display='grid'; g.style.gridTemplateColumns='72px repeat(3,1fr)'; g.style.gap='1px';
  g.style.background='var(--rule)'; g.style.border='1px solid var(--rule)';
  const cellBox=(txt,bg)=>{const d=el('div',null,txt); d.style.background=bg||'var(--panel2)'; d.style.padding='7px 9px'; d.style.fontSize='12px'; return d;};
  g.appendChild(cellBox('','var(--panel)'));
  lv.forEach(x=>g.appendChild(cellBox('Impact '+x,'var(--panel)')));
  [...lv].reverse().forEach(pr=>{
    g.appendChild(cellBox('Prob '+pr,'var(--panel)'));
    lv.forEach(im=>{
      const hits=live.filter(r=>r.probability===pr&&r.impact===im);
      const sc=({Low:1,Medium:2,High:3}[pr])*({Low:1,Medium:2,High:3}[im]);
      const d=cellBox(hits.map(r=>r.ref).join('  ')||'·');
      d.style.color=hits.length?('var(--'+({red:'red',amber:'amber',green:'green'}[expoTone(sc)])+')'):'var(--ink3)';
      d.style.fontWeight=hits.length?'600':'400';
      d.title=hits.map(r=>r.ref+' '+r.title).join('\n');
      g.appendChild(d);

/* ---------- editor modal ---------- */
function openEditor(coll,rec,afterSave){
  const L=LOGS[coll]; if(!L) return;
  const data={...(rec||{})}; if(!data.ref) data.ref=nextRef(coll);
  const scrim=el('div','scrim');
  const box=el('div','modal');
  box.appendChild(el('h3',null,(rec&&rec.id?'Edit ':'New ')+L.label.replace(/s$/,'').toLowerCase()+' · '+data.ref));
  const fields=[{k:'title',label:'Title'},...L.cols.filter(c=>!c.main&&c.k!=='ref'&&!c.k.startsWith('_')),...(L.extra||[])];
  fields.forEach(c=>{
    const f=el('label','field'); f.appendChild(el('span',null,c.label));
    let n;
    if(c.type==='text'){ n=el('textarea','inp'); n.rows=2; }
    else if(c.type==='enum'||c.type==='status'){ n=el('select','inp');
      ['',...(c.opts||[])].forEach(o=>{const op=el('option',null,o||'-');op.value=o;n.appendChild(op);}); }
    else if(c.type==='date'){ n=el('input','inp'); n.type='date'; }
    else if(c.type==='money'){ n=el('input','inp'); n.type='number'; n.step='1'; }
    else { n=el('input','inp'); }
    n.value=data[c.k]??''; n.oninput=()=>{ data[c.k]=(c.type==='money')?Number(n.value||0):n.value; };
    n.onchange=n.oninput;
    f.appendChild(n); box.appendChild(f);
  });
  if(data.quote){ const q=el('div','field'); q.appendChild(el('span',null,'Traced to'));
    q.appendChild(el('div','quote','“'+data.quote+'”'+(data.source?' - '+data.source:''))); box.appendChild(q); }

  const row=el('div','row end');
  if(rec&&rec.id){ const del=el('button','btn danger','Delete');
    del.onclick=()=>{drop(coll,rec.id);close();}; row.appendChild(del); }
  const cancel=el('button','btn','Cancel'); cancel.onclick=()=>close();
  const save=el('button','btn pri','Save');
  save.onclick=async()=>{ if(!data.title||!String(data.title).trim()){flash('It needs a title.');return;}
    await put(coll,data); if(afterSave) await afterSave(); close(); };
  row.append(cancel,save); box.appendChild(row);
  scrim.appendChild(box);
  scrim.onclick=e=>{ if(e.target===scrim) close(); };
  function close(){ scrim.remove(); document.removeEventListener('keydown',onKey); }
  function onKey(e){ if(e.key==='Escape') close(); }
  document.addEventListener('keydown',onKey);
  document.body.appendChild(scrim);
  box.querySelector('.inp')?.focus();
}

## Backbone: what a courier does, left to right
| Set up | Earn | Cash out | Track | Resolve |
| --- | --- | --- | --- | --- |
| Add a debit card | See earnings accrue in real time | Choose instant or standard | See payout status | Report a missing payout |
| Verify identity | See what is eligible to cash out | See the fee before confirming | Get a notification on arrival | Get a plain-language failure reason |
| Accept fee terms | See the daily limit | Confirm with one tap | View payout history | Retry to a different card |

## Release slices

### Walking skeleton - employee dogfood
- Add one debit card through the tokenisation SDK [X-01]
- Instant payout with the fee shown before confirmation
- A ledger entry per payout, reconciled against the partner settlement file
- Failures surfaced to support and resolved by hand

*Proves:* money moves end to end and the ledger reconciles against what the bank says happened.
*Defers:* limits, notifications, self-service recovery.

### Release 1 - five-state pilot
- Daily cap of $500 per courier enforced [D-01]
- Fraud model scoring every payout and blocking above threshold
- Payout status and a notification on arrival
- Support macros for the six most common failures [X-02]

*Proves:* fraud loss stays inside 8 bps with real couriers at real volume.
*Defers:* the national volume tier, self-service retry.

### Release 2 - national launch
- Volume-tier rail once the bank partner certifies it
- Self-service retry to a different card
- Payout history and downloadable statements
- State-by-state enablement behind licensing flags

- Scheduled automatic payouts
- Payout to a bank account rather than a card
- Earnings advance before a shift completes

prd:`# Instant payout failure recovery - PRD

## Summary
When an instant payout fails, the courier sees a generic error and the money sits in limbo until support resolves it by hand. This document specifies a recovery flow that tells the courier what happened, returns the money to a known state, and lets them retry without contacting anyone.

## Problem
In the 10 September dogfood rehearsal, 1 in 37 test payouts failed - mostly expired cards and bank-side declines. Every failure needed a support agent to find the ledger entry, confirm the funds had reversed, and tell the courier. Median resolution was 3 hours 40 minutes. For a courier cashing out on a Friday, that money is often rent.

## Goals
- A courier whose payout fails knows why within 60 seconds, in plain language.
- Funds are always in exactly one visible state: available, in flight, or delivered.
- Most failures are resolved by the courier without a support contact.

## Non-goals
- Preventing failures. Card validation is a separate workstream.
- Recovering payouts blocked by the fraud model. Those follow the risk review path on purpose.

## Users
| User | Job to be done | Today |
| --- | --- | --- |
| Courier | Get my money, or know exactly where it is | Generic error, then waits for support |
| Support agent | Resolve a payout question in one contact | Ledger lookup plus manual confirmation |
| Risk analyst | Tell an ordinary failure apart from a fraud signal | Both arrive in one queue |

## Requirements
| ID | Requirement | Priority | Rationale |
| --- | --- | --- | --- |
| RQ-1 | Map every bank-partner decline code to a courier-readable reason | Must | The error message is the product |
| RQ-2 | Return failed funds to the available balance within 5 minutes | Must | Limbo is what generates the contact |
| RQ-3 | Offer retry to the same or a different card from the failure screen | Must | Most failures are card problems the courier can fix |
| RQ-4 | Limit retries to 3 per payout per hour | Must | Repeated declines are a fraud signal and a fee cost |
| RQ-5 | Show payout state and failure reason to support in one view | Should | One-contact resolution |
| RQ-6 | Route fraud-model blocks to a separate path with no retry | Should | Keeps recovery from becoming a bypass |
| RQ-7 | Notify the courier when funds are returned | Could | Closes the loop without them checking |

## Success metrics
| Metric | Baseline | Target |
| --- | --- | --- |
| Time from failure to the courier knowing why | 3 h 40 m | < 60 seconds |
| Failed payouts resolved without a support contact | 0% | > 70% |
| Support contacts per 1,000 payouts | ~27 | < 8 |

## Dependencies
- The complete decline-code list from Northbank, including codes they rarely emit
- Support macros and escalation path [X-02]

## Risks
- *Assumption:* Northbank returns declined funds to the settlement account within minutes. If reversals are batched daily, RQ-2 means fronting the balance ourselves, which is a treasury decision [X-03], not a product one.

## Launch criteria
Exercised in the five-state pilot [M-03] with deliberately expired test cards, and every failure resolved without a support contact.`
};

function demoDoc(t){
  const body=RECORDED_DOCS[t.id] || ('# '+t.name+'\n\nThis build ships three recorded outputs - the status report, the user story map and a PRD. The hosted build writes all '+ALL_DOCS.length+' from the live program record.\n\nFor reference, this is the structure the generator is given for a '+t.name+':\n\n- '+t.outline.split(';').map(x=>x.trim()).filter(Boolean).join('\n- ')+'\n');
  S.busy='doc'; S.docDraft={type:t.id,title:t.name,body:''}; render();
  let i=0;
  const step=()=>{
    i=Math.min(body.length,i+Math.ceil(body.length/70));
    S.docDraft.body=body.slice(0,i);
    const n=$('#docBody'); if(n) n.innerHTML=md(S.docDraft.body);
    if(i<body.length) setTimeout(step,28); else { S.busy=false; render(); }
  };
  setTimeout(step,500);
}

function demoAsk(q){
  S.busy='ask'; S.askAnswer=''; S.view='brief'; render();
  const body=`National launch on 16 November is exposed on three fronts, in order of how much they can move it:

1. **Bank partner certification.** Northbank's volume-tier rail is not certified until 2 November - after the pilot starts. Running the pilot on the lower tier protects the date at a cost of roughly $14,000; slipping the pilot eats most of the float before launch.
2. **The fraud shadow run.** It has moved three times with no named constraint. The pilot cannot start without it, and one more slip lands it on top of the pilot start date.
3. **The unowned freeze risk.** [R-01] scores 6 and has no owner. The holiday code freeze on 20 November leaves four days to fix anything found at launch, and nobody is planning for that window.

The item with the worst ratio of impact to effort is the third: assigning an owner costs nothing and it is the only one of the three you can close today.

*This build replays one recorded answer. The hosted build sends the live logs to Claude and answers whatever you ask.*`;
  let i=0;
  const step=()=>{
    i=Math.min(body.length,i+Math.ceil(body.length/60));
    S.askAnswer=body.slice(0,i);
    const n=$('#askOut'); if(n) n.innerHTML=md(S.askAnswer); else render();
    if(i<body.length) setTimeout(step,26); else { S.busy=false; render(); }
  };
  setTimeout(step,600);
}

$('#spineGo').onclick=()=>{
  const v=$('#spineInput').value.trim(); if(!v) return;
  if(v.length<160&&/\?$/.test(v)){ askProgram(v); $('#spineInput').value=''; return; }
  if(v.length<40){ flash('That is short. If it is a question, end it with a question mark; otherwise paste more.'); return; }
  runExtract(v,'Pasted'); $('#spineInput').value='';
};
$('#spineInput').onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); $('#spineGo').click(); } };
